# Meliora settings. Edit freely; the app re-reads this on each run.

[weather]
# Open-Meteo models pulled for every place (free, no key). Keenan uses ECMWF and NAM;
# his phone covers the rest. Meliora only needs these to raise alerts.
models = ["ecmwf_ifs025", "ncep_nam_conus"]
forecast_days = 14
refresh_hours = 3          # the app refetches on launch if the cache is older than this
nws_user_agent = "meliora-personal-assistant"

# kind: home | peak | resort. elev_m is what the forecast is downscaled to
# (summit for peaks, upper mountain for resorts).
[[places]]
id = "golden"
name = "Golden"
kind = "home"
lat = 39.7555
lon = -105.2211
elev_m = 1730

