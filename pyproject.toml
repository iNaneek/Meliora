[project]
name = "meliora"
version = "0.1.0"
description = "Keenan's personal assistant: what to do next."
readme = "README.md"
authors = [
    { name = "iNaneek", email = "inaneek42@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2.1",
]

[project.scripts]
meliora = "meliora:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"
