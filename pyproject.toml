[project]
name = "meliora"
version = "0.1.0"
description = "A personal Mac assistant that tells you what to do next."
readme = "README.md"
authors = [
    { name = "iNaneek", email = "118861082+iNaneek@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.19",
    "keyring>=25.7.0",
    "pyobjc-framework-eventkit>=12.2,<13",
    "pywebview>=6.2.1",
]

[project.scripts]
meliora = "meliora:main"
meliora-weather = "meliora.weather:main"
meliora-garmin = "meliora.garmin:main"

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"
